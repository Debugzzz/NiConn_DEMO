name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "NiConn_Demo-${GITHUB_REF_NAME}.apk"

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: NiConn_Demo-*.apk
